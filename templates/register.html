{% extends 'base.html' %}
{% load static %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-page d-flex justify-content-center align-items-center">
    <div class="auth-card">

        <h3 class="fw-bold mb-1">Create Account</h3>
        <p class="text-secondary mb-4">Join and start video calling</p>

        <!-- Error Message -->
        {% if error %}
        <div class="alert alert-danger py-2" role="alert">
            âš ï¸ {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <!-- Full Name -->
            <div class="mb-3">
                <label class="form-label text-secondary small">Full Name</label>
                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Enter your full name"
                    value="{{ name|default:'' }}"
                    required
                >
            </div>

            <!-- Username -->
            <div class="mb-3">
                <label class="form-label text-secondary small">Username</label>
                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Choose a username (min 3 chars)"
                    value="{{ username|default:'' }}"
                    required
                >
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label text-secondary small">Password</label>
                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Choose a password (min 4 chars)"
                    required
                >
            </div>

            <!-- Confirm Password -->
            <div class="mb-4">
                <label class="form-label text-secondary small">Confirm Password</label>
                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Re-enter your password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-orange w-100">
                Create Account <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <p class="text-center text-secondary mt-3 mb-0 small">
            Already have an account?
            <a href="{% url 'login' %}" class="text-warning text-decoration-none">Login here</a>
        </p>

    </div>
</div>
{% endblock %}
